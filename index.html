<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>成語&amp;修辭配對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #EAF4FB;
    --bg-bottom: #CFE8F7;
    --paper: #FFFFFF;
    --paper-soft: #F6FBFE;
    --ink: #1E3A4C;
    --ink-soft: #5B7A8C;
    --line: #D8E8F0;
    --sun: #FFC93C;
    --sun-deep: #F2A900;
    --cat0: #FF6B6B;   /* 譬喻 */
    --cat0-soft: #FFE3E3;
    --cat1: #2FB894;   /* 類疊 */
    --cat1-soft: #DAF4EC;
    --cat2: #6E7FE0;   /* 設問 */
    --cat2-soft: #E3E6FB;
    --cat3: #E0A15C;   /* 備用第4類 */
    --cat3-soft: #FBEBD8;
    --danger: #E85555;
    --shadow-line: 0 3px 0 var(--line), 0 6px 14px rgba(30,58,76,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #0F2233;
      --bg-bottom: #0A1826;
      --paper: #17293B;
      --paper-soft: #12212F;
      --ink: #EAF4FB;
      --ink-soft: #9FC0D4;
      --line: #24394C;
      --sun: #FFD166;
      --sun-deep: #FFB238;
      --cat0: #FF8A8A;
      --cat0-soft: #3A2226;
      --cat1: #4FD9B4;
      --cat1-soft: #163229;
      --cat2: #9AA4F2;
      --cat2-soft: #232849;
      --cat3: #E8B67C;
      --cat3-soft: #34281a;
      --danger: #FF6B6B;
      --shadow-line: 0 3px 0 var(--line), 0 6px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #0F2233;
    --bg-bottom: #0A1826;
    --paper: #17293B;
    --paper-soft: #12212F;
    --ink: #EAF4FB;
    --ink-soft: #9FC0D4;
    --line: #24394C;
    --sun: #FFD166;
    --sun-deep: #FFB238;
    --cat0: #FF8A8A;
    --cat0-soft: #3A2226;
    --cat1: #4FD9B4;
    --cat1-soft: #163229;
    --cat2: #9AA4F2;
    --cat2-soft: #232849;
    --cat3: #E8B67C;
    --cat3-soft: #34281a;
    --danger: #FF6B6B;
    --shadow-line: 0 3px 0 var(--line), 0 6px 14px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 48px;
  }

  .wave {
    display: block;
    width: 100%;
    height: 46px;
  }
  .wave path { fill: var(--paper); opacity: 0.55; }
  .wave path.p2 { opacity: 0.35; }

  .page { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  header.top {
    padding: 22px 4px 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 46px; height: 46px;
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 24px;
    margin: 0;
    letter-spacing: .5px;
    color: var(--ink);
  }
  .lesson-name {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
    font-weight: 500;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mode-toggle {
    display: flex;
    background: var(--paper);
    border-radius: 12px;
    padding: 3px;
    box-shadow: var(--shadow-line);
    gap: 2px;
  }
  .mode-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  .mode-btn.active { background: var(--ink); color: var(--paper); }
  .btn-ghost {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--shadow-line);
  }
  .btn-ghost:active { transform: translateY(1px); }
  .btn-ghost.active { background: var(--ink); color: var(--paper); }

  .lesson-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 6px 4px 18px;
  }
  .lesson-tab {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .lesson-tab.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 4px 18px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .stat b {
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    color: var(--ink);
  }
  .progress-track {
    flex: 1;
    min-width: 120px;
    height: 8px;
    background: var(--paper);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cat1), var(--sun));
    border-radius: 6px;
    width: 0%;
    transition: width .35s ease;
  }

  .timer-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .timer-track {
    width: 90px;
    height: 8px;
    background: var(--paper);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .timer-fill {
    height: 100%;
    background: var(--cat1);
    border-radius: 6px;
    width: 100%;
    transition: width 1s linear, background-color .3s ease;
  }
  .timer-fill.low { background: var(--danger); }
  .timer-value {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    min-width: 26px;
    font-variant-numeric: tabular-nums;
  }
  .timer-value.low {
    color: var(--danger);
    animation: pulseTime 1s ease infinite;
  }
  @keyframes pulseTime {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  .baskets.locked .basket,
  .pool.locked .card {
    opacity: .5;
    pointer-events: none;
  }

  .board {
    display: grid;
    grid-template-columns: minmax(220px, 300px) 1fr;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr; }
  }
  .board.stacked {
    grid-template-columns: 1fr;
  }

  .baskets {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .baskets.grid-mode {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .baskets.grid-mode .basket {
    padding: 10px 12px 9px;
  }
  .baskets.grid-mode .basket-hint {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .baskets.grid-mode .basket-slots {
    margin-top: 8px;
  }
  .baskets.grid-mode .basket-chip {
    font-size: 11.5px;
    padding: 6px 8px;
  }
  .basket {
    background: var(--paper);
    border-radius: 18px;
    padding: 14px 14px 12px;
    box-shadow: var(--shadow-line);
    border: 2.5px solid transparent;
    transition: border-color .15s ease, transform .12s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .basket::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 6px;
    background: var(--cat-color, var(--cat0));
  }
  .basket:hover { transform: translateY(-1px); }
  .basket.selected {
    border-color: var(--cat-color, var(--cat0));
  }
  .basket.wrong {
    animation: shake .38s ease;
  }
  .basket.complete {
    opacity: .55;
    cursor: default;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .basket-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-left: 8px;
  }
  .basket-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--cat-color, var(--cat0));
  }
  .basket-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--cat-soft, var(--cat0-soft));
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .basket-hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 0 8px;
    line-height: 1.5;
  }
  body.test-mode .basket-hint { display: none; }
  .basket-slots {
    margin: 10px 0 0 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .basket-chip {
    background: var(--cat-soft, var(--cat0-soft));
    color: var(--ink);
    font-size: 12.5px;
    padding: 7px 10px;
    border-radius: 10px;
    line-height: 1.4;
  }

  .pool-wrap {
    background: var(--paper-soft);
    border-radius: 18px;
    padding: 16px;
    min-height: 220px;
  }
  .pool-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin: 0 0 10px 4px;
  }
  .pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-content: flex-start;
  }
  .card {
    background: var(--paper);
    border-radius: 14px;
    padding: 13px 15px;
    font-size: 14.5px;
    line-height: 1.6;
    box-shadow: var(--shadow-line);
    cursor: pointer;
    max-width: 100%;
    border: 2.5px solid transparent;
    transition: transform .12s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-1px); }
  .card.selected {
    border-color: var(--sun-deep);
    background: var(--paper-soft);
    box-shadow: var(--shadow-line), 0 0 0 1px var(--sun-deep) inset;
  }
  .card-note {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--sun-deep);
  }
  .card.wrong-shake { animation: shake .38s ease; border-color: var(--danger); }
  .card:active { transform: scale(0.98); }
  .pool-empty {
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px 4px;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 20px;
    border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 90;
    opacity: 0; transition: opacity .2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(15, 34, 51, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .win-card {
    background: var(--paper);
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .win-card h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    margin: 4px 0 6px;
  }
  .stars {
    font-size: 40px;
    letter-spacing: 4px;
    margin: 10px 0 8px;
  }
  .star-dim { opacity: .25; }
  .win-sub {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin-bottom: 20px;
  }
  .win-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn-primary {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    cursor: pointer;
    background: var(--ink);
    color: var(--paper);
  }

  button:focus-visible, .basket:focus-visible, .card:focus-visible, .lesson-tab:focus-visible {
    outline: 3px solid var(--cat2);
    outline-offset: 2px;
  }

  /* ===== 一題一題選字模式 ===== */
  .pick-panel {
    background: var(--paper);
    border-radius: 22px;
    box-shadow: var(--shadow-line);
    padding: 26px 18px 24px;
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
  }
  .pick-count { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .pick-word {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    margin: 18px 0 6px;
    font-size: 56px; font-weight: 900; line-height: 1.1;
  }
  .pick-box {
    width: 1.15em; height: 1.15em;
    border: 3px dashed var(--ink-soft);
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pick-box.ok { border: 3px solid var(--cat1); color: var(--cat1); background: var(--cat1-soft); }
  .pick-box.no { border: 3px solid var(--danger); color: var(--danger); background: var(--cat0-soft); }
  .pick-zhuyin { font-size: 17px; color: var(--ink-soft); letter-spacing: 2px; margin-bottom: 22px; }
  .pick-options { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
  .pick-opt {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 40px; font-weight: 900;
    width: 92px; height: 92px;
    border-radius: 18px;
    border: 3px solid var(--line);
    background: var(--paper-soft);
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow-line);
  }
  .pick-opt:hover:not(:disabled) { border-color: var(--sun-deep); }
  .pick-opt:disabled { cursor: default; }
  .pick-opt.ok { border-color: var(--cat1); background: var(--cat1-soft); color: var(--cat1); }
  .pick-opt.no { border-color: var(--danger); background: var(--cat0-soft); color: var(--danger); animation: shake .38s ease; }
  .pick-kind {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; color: #fff; background: var(--cat2);
  }
  .pick-kind.sound { background: var(--cat0); }
  .pick-mark { color: var(--danger); text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 3px; }
  .pick-mark-inline { color: var(--danger); }
  .pick-note { font-size: 14px; margin-bottom: 8px; letter-spacing: 0; }
  .pick-zhuyin { letter-spacing: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
  .pick-zhuyin:empty { margin-bottom: 18px; }
  .pick-box.sound { width: auto; min-width: 92px; height: 46px; padding: 0 10px; font-size: 24px; font-weight: 900; }
  .pick-note { flex-basis: 100%; }
  .pick-opt.sound { width: auto; min-width: 120px; padding: 0 16px; font-size: 28px; }
  .pick-feedback { min-height: 26px; margin-top: 18px; font-size: 16px; font-weight: 700; }
  .pick-feedback.ok { color: var(--cat1); }
  .pick-feedback.no { color: var(--danger); }
  .pick-next { margin-top: 10px; }
  @media (max-width: 480px) {
    .pick-word { font-size: 46px; }
    .pick-opt { width: 74px; height: 74px; font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pick-opt.no { animation: none; }
    .basket, .card, .progress-fill, .timer-fill { transition: none; }
    .basket.wrong, .card.wrong-shake, .timer-value.low { animation: none; }
  }
</style>

<div class="page">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none">
        <path d="M6 30 Q24 22 42 30 L38 36 Q24 32 10 36 Z" fill="var(--cat2)"/>
        <path d="M24 8 L24 28" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 10 Q34 14 24 22 Z" fill="var(--cat0)"/>
      </svg>
      <div>
        <h1>成語&amp;修辭配對</h1>
        <div class="lesson-name" id="lessonName">第 1 課：字的小旅行</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="mode-toggle" role="group" aria-label="切換模式">
        <button class="mode-btn" id="btnLearn" aria-pressed="false">💡 學習模式</button>
        <button class="mode-btn active" id="btnTest" aria-pressed="true">📝 測驗模式</button>
      </div>
      <button class="btn-ghost active" id="btnTimerToggle" aria-pressed="true">⏱ 限時30秒</button>
      <button class="btn-ghost" id="btnRestart">↺ 重新開始</button>
    </div>
  </header>

  <div class="lesson-tabs" id="lessonTabs"></div>

  <div class="stats-row">
    <div class="stat">已完成 <b id="statDone">0</b>/<span id="statTotal">0</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stat">⚠️ 答錯 <b id="statMiss">0</b></div>
    <div class="timer-wrap" id="timerWrap">
      <span>⏱</span>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-value" id="timerValue">30</div>
    </div>
  </div>

  <main class="board" id="board">
    <section class="baskets" id="baskets" aria-label="修辭類別"></section>
    <section class="pool-wrap">
      <div class="pool-title">句子（點一句，再點左邊的修辭類別）</div>
      <div class="pool" id="pool"></div>
    </section>
  </main>

  <section class="pick-panel" id="pickPanel" hidden>
    <div class="pick-count" id="pickCount"></div>
    <div class="pick-word" id="pickWord"></div>
    <div class="pick-zhuyin" id="pickZhuyin"></div>
    <div class="pick-options" id="pickOptions"></div>
    <div class="pick-feedback" id="pickFeedback"></div>
    <button class="btn-primary pick-next" id="pickNext" hidden>下一題 ➜</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="winOverlay">
  <div class="win-card">
    <div style="font-size:34px;" id="winIcon">🎉</div>
    <h2 id="winTitle">全部過關！</h2>
    <div class="stars" id="stars"></div>
    <div class="win-sub" id="winSub"></div>
    <div class="win-actions">
      <button class="btn-primary" id="btnPlayAgain">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   課程資料區：以後每一課只要在 LESSONS 陣列裡「新增一個物件」即可，
   不需要更動下面的程式邏輯。

   categories：這一課要考的修辭類別，順序就是卡片顯示順序
     - name：修辭名稱（顯示在籃子上）
     - hint：這個修辭的簡短說明（學習模式才會顯示）

   sentences：句子題目
     - text：句子內容
     - cat：對應 categories 陣列的索引（從 0 開始）
     　　例如 cat: 0 代表對應到 categories[0]
     - 同一個修辭可以有兩句以上，只要 cat 設一樣的數字即可
   ============================================================ */
const LESSONS = [
  {
    id: 'l1',
    title: '第 1 課：字的小旅行',

    title: '第1-3課成語總複習（例句填空）',
    categories: [
      { name: '木已成舟', hint: '木材已經做成船隻，比喻已成事實，無法改變。' },
      { name: '洋洋灑灑', hint: '形容言論或文章長篇大論。' },
      { name: '滿載而歸', hint: '裝載得滿滿的回來，比喻收穫豐富。' },
      { name: '塞翁失馬', hint: '比喻暫時受到損失，卻因禍得福，終於得到好處。' },
      { name: '家喻戶曉', hint: '家家戶戶都知曉，形容事情、名聲傳播極廣。' },
      { name: '拍案叫絕', hint: '拍桌子叫好，形容非常讚賞。' },
      { name: '東窗事發', hint: '在東窗下的密謀已被揭發，比喻陰謀或非法勾當敗露。' },
      { name: '搖旗吶喊', hint: '打仗時，揮舞旗幟，嘶喊以助聲威，比喻為他人助長聲勢。' },
      { name: '咎由自取', hint: '所有的罪過、災禍都是自己造成的。' },
      { name: '撲朔迷離', hint: '形容事物錯綜複雜，難以辨明真相。' },
      { name: '餘音繞梁', hint: '形容歌聲或音樂美妙，餘味不絕。' },
      { name: '嘆為觀止', hint: '讚美所看到的事物好到極點，無與倫比。' }
    ],
    sentences: [
      { text: '過去的事____，如今說什麼都是多餘。', cat: 0 },
      { text: '他拿起筆，在短時間內____的寫下了一篇文章。', cat: 1 },
      { text: '這次戶外教育，同學們都____，收穫非常多。', cat: 2 },
      { text: '那位明星雖然沒有得獎，但是從此打開了知名度，真可說是____。', cat: 3 },
      { text: '李安是一位____的電影導演。', cat: 4 },
      { text: '看到同學精采的表演，大家都____。', cat: 5 },
      { text: '那個犯罪集團所做的壞事____，受到法律制裁。', cat: 6 },
      { text: '觀眾席上的球迷紛紛為自己支持的隊伍____。', cat: 7 },
      { text: '他的品行差勁，難怪不受大家歡迎，這是他____。', cat: 8 },
      { text: '這個故事情節____，讓人很想繼續看下去。', cat: 9 },
      { text: '他的歌聲優美，____，讓人回味不已。', cat: 10 },
      { text: '看到美麗的煙火表演，大家都____。', cat: 11 }
    ]
  }
];

const CAT_COLORS = [
  { color: 'var(--cat0)', soft: 'var(--cat0-soft)' },
  { color: 'var(--cat1)', soft: 'var(--cat1-soft)' },
  { color: 'var(--cat2)', soft: 'var(--cat2-soft)' },
  { color: 'var(--cat3)', soft: 'var(--cat3-soft)' }
];

let currentLessonIndex = 0;
let pool = [];          // 尚未配對成功的句子 {id, text, cat}
let matched = [];       // 每個類別已配對的句子清單 (index 對應 categories)
let selectedSentenceId = null;
let selectedCatIndex = null;
let mistakeCount = 0;
let gameOver = false;

// 限時挑戰設定：預設每一課有 30 秒，要調整秒數改這裡即可
const TIME_LIMIT_SECONDS = 30;
let timerEnabled = true;
let timeLeft = TIME_LIMIT_SECONDS;
let timerInterval = null;

const $ = (sel) => document.querySelector(sel);
const lessonTabsEl = $('#lessonTabs');
const boardEl = $('#board');
const basketsEl = $('#baskets');
const poolEl = $('#pool');
const toastEl = $('#toast');

// 類別數量超過這個門檻時，籃子改用「多欄小卡」排版，避免題目一多畫面就被拉得很長
const COMPACT_CATEGORY_THRESHOLD = 5;

// 一句話可以同時符合多個類別：cat 可以是數字，也可以是陣列（例如 [0, 1, 2]）
function catsOf(s) { return Array.isArray(s.cat) ? s.cat : [s.cat]; }
function totalPairings(lesson) { return lesson.sentences.reduce((sum, s) => sum + catsOf(s).length, 0); }
const DEFAULT_POOL_TITLE = '句子（點一句，再點左邊的修辭類別）';

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

function renderLessonTabs() {
  lessonTabsEl.innerHTML = '';
  if (LESSONS.length < 2) return; // 只有一課時不需要顯示切換列
  LESSONS.forEach((lesson, i) => {
    const b = document.createElement('button');
    b.className = 'lesson-tab' + (i === currentLessonIndex ? ' active' : '');
    b.textContent = lesson.title;
    b.onclick = () => { currentLessonIndex = i; startLesson(); };
    lessonTabsEl.appendChild(b);
  });
}

/* ===== 一題一題選字 ===== */
let pickQs = [], pickIdx = 0, pickRight = 0;
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function setPickMode(on) {
  boardEl.hidden = on;
  document.querySelector('.stats-row').hidden = on;
  document.querySelector('.mode-toggle').hidden = on;
  document.getElementById('btnTimerToggle').hidden = on;
  document.getElementById('pickPanel').hidden = !on;
}

function startPick(lesson) {
  clearInterval(timerInterval);
  gameOver = true;
  const of = kind => shuffle(lesson.groups.filter(g => (g.kind || 'shape') === kind)
    .flatMap(g => g.items.map(it => ({ ...it, chars: g.chars, kind }))));
  pickQs = of('sound').concat(of('shape'));
  pickIdx = 0; pickRight = 0;
  renderPick();
}

function renderPick() {
  const q = pickQs[pickIdx];
  updatePickCount();
  if (q.kind === 'sound') {
    $('#pickWord').innerHTML = [...q.word].map((c, i) =>
      i === q.mark ? `<span class="pick-mark">${esc(c)}</span>` : esc(c)).join('');
    $('#pickZhuyin').innerHTML = (q.note ? `<div class="pick-note">${esc(q.note)}</div>` : '') +
      `「<b class="pick-mark-inline">${esc(q.word[q.mark])}</b>」的讀音：<span class="pick-box sound" id="pickBox"></span>`;
  } else {
    $('#pickWord').innerHTML = esc(q.word).replace('□', '<span class="pick-box" id="pickBox"></span>');
    $('#pickZhuyin').innerHTML = '';
  }
  $('#pickFeedback').textContent = '';
  $('#pickFeedback').className = 'pick-feedback';
  $('#pickNext').hidden = true;
  const opts = $('#pickOptions');
  opts.innerHTML = '';
  shuffle(q.chars).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'pick-opt' + (q.kind === 'sound' ? ' sound' : '');
    b.textContent = ch;
    b.onclick = () => onPick(ch, b);
    opts.appendChild(b);
  });
}

function updatePickCount() {
  const q = pickQs[pickIdx];
  const tag = q.kind === 'sound' ? '多音字' : '形近字';
  $('#pickCount').innerHTML = `<span class="pick-kind ${q.kind}">${tag}</span>　第 ${pickIdx + 1} 題 / 共 ${pickQs.length} 題　答對 ${pickRight} 題`;
}

function onPick(ch, btn) {
  const q = pickQs[pickIdx];
  const box = $('#pickBox');
  const all = [...document.querySelectorAll('.pick-opt')];
  all.forEach(b => b.disabled = true);
  box.textContent = q.answer;
  const fb = $('#pickFeedback');
  if (ch === q.answer) {
    pickRight++;
    btn.classList.add('ok');
    box.classList.add('ok');
    fb.textContent = '答對了！👍';
    fb.className = 'pick-feedback ok';
  } else {
    btn.classList.add('no');
    all.find(b => b.textContent === q.answer).classList.add('ok');
    box.classList.add('no');
    fb.textContent = `不對喔，正確的是「${q.answer}」`;
    fb.className = 'pick-feedback no';
  }
  updatePickCount();
  const next = $('#pickNext');
  next.textContent = pickIdx + 1 < pickQs.length ? '下一題 ➜' : '看成績 ➜';
  next.hidden = false;
  next.focus();
}

$('#pickNext').onclick = () => {
  pickIdx++;
  if (pickIdx < pickQs.length) { renderPick(); return; }
  const total = pickQs.length;
  const starCount = pickRight === total ? 3 : (pickRight >= total * 0.7 ? 2 : 1);
  $('#winIcon').textContent = pickRight === total ? '🎉' : '💪';
  $('#winTitle').textContent = pickRight === total ? '全部答對！' : '完成了！';
  const starsEl = $('#stars');
  starsEl.style.display = '';
  starsEl.innerHTML = [1,2,3].map(n => `<span class="${n <= starCount ? '' : 'star-dim'}">⭐</span>`).join('');
  $('#winSub').textContent = `${total} 題答對 ${pickRight} 題` + (pickRight < total ? '，再玩一次挑戰全對！' : '！');
  $('#winOverlay').classList.add('show');
};

function startLesson() {
  const lesson = LESSONS[currentLessonIndex];
  $('#lessonName').textContent = lesson.title;
  $('#winOverlay').classList.remove('show');
  setPickMode(lesson.type === 'pick');
  if (lesson.type === 'pick') { renderLessonTabs(); startPick(lesson); return; }
  document.getElementById('statTotal').textContent = totalPairings(lesson);
  document.querySelector('.pool-title').textContent = lesson.note || DEFAULT_POOL_TITLE;
  mistakeCount = 0;
  selectedSentenceId = null;
  selectedCatIndex = null;
  gameOver = false;
  matched = lesson.categories.map(() => []);
  pool = shuffle(lesson.sentences.map((s, i) => ({ id: 'l' + currentLessonIndex + '-' + i, text: s.text, cats: catsOf(s), remaining: catsOf(s).slice() })));
  renderLessonTabs();
  renderBaskets();
  renderPool();
  updateStats();
  $('#winOverlay').classList.remove('show');
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT_SECONDS;
  updateTimerUI();
  document.getElementById('timerWrap').style.display = timerEnabled ? 'flex' : 'none';
  if (!timerEnabled) return;
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      onTimeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timerValue').textContent = timeLeft;
  const pct = Math.max(0, timeLeft / TIME_LIMIT_SECONDS * 100);
  document.getElementById('timerFill').style.width = pct + '%';
  document.getElementById('timerFill').classList.toggle('low', timeLeft <= 10);
  document.getElementById('timerValue').classList.toggle('low', timeLeft <= 10);
}

function onTimeUp() {
  if (gameOver) return;
  gameOver = true;
  selectedSentenceId = null;
  selectedCatIndex = null;
  renderBaskets();
  renderPool();
  showTimeUp();
}

function renderBaskets() {
  const lesson = LESSONS[currentLessonIndex];
  basketsEl.innerHTML = '';
  basketsEl.classList.toggle('locked', gameOver);
  const isCompact = lesson.categories.length > COMPACT_CATEGORY_THRESHOLD;
  basketsEl.classList.toggle('grid-mode', isCompact);
  boardEl.classList.toggle('stacked', isCompact);
  lesson.categories.forEach((cat, i) => {
    const colors = CAT_COLORS[i % CAT_COLORS.length];
    const div = document.createElement('div');
    const total = lesson.sentences.filter(s => catsOf(s).includes(i)).length;
    const done = matched[i].length;
    div.className = 'basket' + (done === total ? ' complete' : '') + (selectedCatIndex === i ? ' selected' : '');
    div.style.setProperty('--cat-color', colors.color);
    div.style.setProperty('--cat-soft', colors.soft);
    div.tabIndex = 0;
    div.setAttribute('role', 'button');
    div.setAttribute('aria-label', '修辭類別：' + cat.name);
    div.innerHTML = `
      <div class="basket-head">
        <div class="basket-name">${cat.name}</div>
        <div class="basket-count">${done}/${total}</div>
      </div>
      ${cat.hint ? `<div class="basket-hint">${cat.hint}</div>` : ''}
      <div class="basket-slots">${matched[i].map(m => `<div class="basket-chip">${m.text}</div>`).join('')}</div>
    `;
    if (done < total) {
      div.onclick = () => onPickCategory(i);
      div.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPickCategory(i); } };
    }
    basketsEl.appendChild(div);
  });
}

function renderPool() {
  poolEl.innerHTML = '';
  poolEl.classList.toggle('locked', gameOver);
  if (pool.length === 0) {
    poolEl.innerHTML = '<div class="pool-empty">句子都配對完成囉！</div>';
    return;
  }
  pool.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card' + (selectedSentenceId === s.id ? ' selected' : '');
    card.dataset.id = s.id;
    const main = document.createElement('div');
    main.textContent = s.text;
    card.appendChild(main);
    if (s.cats.length > 1) {
      const note = document.createElement('div');
      note.className = 'card-note';
      note.textContent = '★ 這一句要配對 ' + s.remaining.length + ' 種';
      card.appendChild(note);
    }
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.onclick = () => onPickSentence(s.id);
    card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPickSentence(s.id); } };
    poolEl.appendChild(card);
  });
}

function updateStats() {
  const lesson = LESSONS[currentLessonIndex];
  const done = matched.reduce((sum, arr) => sum + arr.length, 0);
  document.getElementById('statDone').textContent = done;
  document.getElementById('statMiss').textContent = mistakeCount;
  document.getElementById('progressFill').style.width = (done / totalPairings(lesson) * 100) + '%';
}

function onPickSentence(id) {
  if (gameOver) return;
  selectedSentenceId = (selectedSentenceId === id) ? null : id;
  renderPool();
  if (selectedSentenceId !== null && selectedCatIndex !== null) attemptMatch();
}

function onPickCategory(i) {
  if (gameOver) return;
  selectedCatIndex = (selectedCatIndex === i) ? null : i;
  renderBaskets();
  if (selectedSentenceId !== null && selectedCatIndex !== null) attemptMatch();
}

function attemptMatch() {
  const lesson = LESSONS[currentLessonIndex];
  const sentence = pool.find(s => s.id === selectedSentenceId);
  if (!sentence) return;
  if (sentence.cats.includes(selectedCatIndex) && !sentence.remaining.includes(selectedCatIndex)) {
    // 這一句已經配對過這個類別了：不算錯，只提醒
    selectedCatIndex = null;
    renderBaskets();
    showToast('這一句已經配對過這個了，換另一種試試');
    return;
  }
  if (sentence.remaining.includes(selectedCatIndex)) {
    const hitCat = selectedCatIndex;
    matched[hitCat].push({ id: sentence.id, text: sentence.text });
    sentence.remaining = sentence.remaining.filter(c => c !== hitCat);
    if (sentence.remaining.length === 0) pool = pool.filter(s => s.id !== sentence.id);
    selectedSentenceId = null;
    selectedCatIndex = null;
    renderBaskets();
    renderPool();
    updateStats();
    showToast('答對了！' + lesson.categories[hitCat].name + (sentence.remaining.length ? '（這句還要再配對 ' + sentence.remaining.length + ' 種）' : ''));
    if (pool.length === 0) {
      clearInterval(timerInterval);
      gameOver = true;
      setTimeout(showWin, 350);
    }
  } else {
    mistakeCount++;
    const wrongCatIndex = selectedCatIndex;
    const wrongId = sentence.id;
    gameOver = true;
    clearInterval(timerInterval);
    selectedSentenceId = null;
    selectedCatIndex = null;
    renderBaskets();
    renderPool();
    updateStats();
    const basketNodes = basketsEl.children;
    if (basketNodes[wrongCatIndex]) {
      basketNodes[wrongCatIndex].classList.add('wrong');
    }
    const cardNodes = poolEl.children;
    for (const node of cardNodes) {
      if (node.dataset.id === wrongId) {
        node.classList.add('wrong-shake');
      }
    }
    showToast('按錯了，挑戰失敗！');
    setTimeout(showFail, 500);
  }
}

function showFail() {
  const total = totalPairings(LESSONS[currentLessonIndex]);
  const done = matched.reduce((sum, arr) => sum + arr.length, 0);
  $('#winIcon').textContent = '❌';
  $('#winTitle').textContent = '答錯了，挑戰失敗！';
  const starsEl = $('#stars');
  starsEl.style.display = 'none';
  starsEl.innerHTML = '';
  $('#winSub').textContent = `答對了 ${done} / ${total} 項，按到錯的類別就算失敗。按「重新開始」再挑戰一次，這次按之前要想清楚喔！`;
  $('#winOverlay').classList.add('show');
}

function showWin() {
  const total = totalPairings(LESSONS[currentLessonIndex]);
  let starCount = 3;
  if (mistakeCount >= total) starCount = 1;
  else if (mistakeCount > 0) starCount = 2;
  $('#winIcon').textContent = '🎉';
  $('#winTitle').textContent = '全部過關！';
  const starsEl = $('#stars');
  starsEl.style.display = '';
  starsEl.innerHTML = [1,2,3].map(n => `<span class="${n <= starCount ? '' : 'star-dim'}">⭐</span>`).join('');
  $('#winSub').textContent = `答錯 ${mistakeCount} 次，全部 ${total} 項都配對正確了！`;
  $('#winOverlay').classList.add('show');
}

function showTimeUp() {
  const total = totalPairings(LESSONS[currentLessonIndex]);
  const done = matched.reduce((sum, arr) => sum + arr.length, 0);
  $('#winIcon').textContent = '⏰';
  $('#winTitle').textContent = '時間到！';
  const starsEl = $('#stars');
  starsEl.style.display = 'none';
  starsEl.innerHTML = '';
  $('#winSub').textContent = `完成了 ${done} / ${total} 項，答錯 ${mistakeCount} 次，再試一次看看！`;
  $('#winOverlay').classList.add('show');
}

document.getElementById('btnRestart').onclick = startLesson;
document.getElementById('btnPlayAgain').onclick = startLesson;

document.getElementById('btnTimerToggle').onclick = (e) => {
  timerEnabled = !timerEnabled;
  e.currentTarget.classList.toggle('active', timerEnabled);
  e.currentTarget.setAttribute('aria-pressed', String(timerEnabled));
  e.currentTarget.textContent = timerEnabled ? `⏱ 限時${TIME_LIMIT_SECONDS}秒` : '⏱ 不限時';
  startTimer();
};

document.getElementById('btnLearn').onclick = () => {
  document.body.classList.remove('test-mode');
  document.getElementById('btnLearn').classList.add('active');
  document.getElementById('btnLearn').setAttribute('aria-pressed', 'true');
  document.getElementById('btnTest').classList.remove('active');
  document.getElementById('btnTest').setAttribute('aria-pressed', 'false');
};
document.getElementById('btnTest').onclick = () => {
  document.body.classList.add('test-mode');
  document.getElementById('btnTest').classList.add('active');
  document.getElementById('btnTest').setAttribute('aria-pressed', 'true');
  document.getElementById('btnLearn').classList.remove('active');
  document.getElementById('btnLearn').setAttribute('aria-pressed', 'false');
};

document.body.classList.add('test-mode');
startLesson();
</script>


</body></html>
